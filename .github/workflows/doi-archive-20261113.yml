name: Publish authorised archival snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/doi-archive-20261113.yml']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish dated source archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_REPO: ${{ github.repository }}
          ARCHIVE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["ARCHIVE_REPO"]
          sha = os.environ["ARCHIVE_SHA"]
          tag = "archive-2026-11-13"
          base = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=body, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          try:
              existing = request("/releases/tags/" + tag)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              print("Existing archival release retained:", existing["html_url"])
              raise SystemExit(0)
          result = request("/releases", {
              "tag_name": tag, "target_commitish": sha,
              "name": repo.split("/")[1] + ": archival source snapshot, 13 November 2026",
              "body": "Dated source snapshot for preservation and citation through Zenodo.\n\nSource commit: " + sha + "\n\nThis archives the existing implementation and documentation without changing the package version or asserting peer review, independent validation, production readiness or a new reuse licence. Existing licences and third-party notices retain their stated scope. Creator identity and archival rights are specified in .zenodo.json.",
              "draft": False, "prerelease": False, "make_latest": "false"
          })
          print(result["html_url"])
          PY
